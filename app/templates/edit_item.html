{% extends 'base.html' %}
{% block title %}Edit Item{% endblock %}

{% block content %}
<section class="hero">
    <p class="muted">Inventory Module</p>
    <h1>Edit Item</h1>
    <p class="muted">
        Update the selected inventory record while preserving category and location consistency.
    </p>
</section>

<section class="form-card narrow" style="margin-top: 1rem;">
    <h2>Edit {{ item.item_name }}</h2>

    <form method="post">
        <label for="item_name">Item Name</label>
        <input id="item_name" name="item_name" value="{{ item.item_name }}" required>

        <label for="description">Description</label>
        <textarea id="description" name="description">{{ item.description or '' }}</textarea>

        <label for="quantity_in_stock">Quantity in Stock</label>
        <input id="quantity_in_stock" type="number" name="quantity_in_stock" min="0" value="{{ item.quantity_in_stock }}" required>

        <label for="reorder_level">Reorder Level</label>
        <input id="reorder_level" type="number" name="reorder_level" min="0" value="{{ item.reorder_level }}" required>

        <label for="unit_price">Unit Price</label>
        <input id="unit_price" type="number" step="0.01" name="unit_price" min="0" value="{{ item.unit_price }}" required>

        <label for="category_id">Category</label>
        <select id="category_id" name="category_id" required>
            {% for category in categories %}
                <option value="{{ category.category_id }}" {% if category.category_id == item.category_id %}selected{% endif %}>
                    {{ category.category_name }}
                </option>
            {% endfor %}
        </select>

        <label for="location_id">Location</label>
        <select id="location_id" name="location_id" required>
            {% for location in locations %}
                <option value="{{ location.location_id }}" {% if location.location_id == item.location_id %}selected{% endif %}>
                    {{ location.code }} ({{ location.warehouse.warehouse_name }})
                </option>
            {% endfor %}
        </select>

        <div class="button-row">
            <button class="btn" type="submit">Update Item</button>
            <a class="btn btn-secondary" href="{{ url_for('items') }}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
